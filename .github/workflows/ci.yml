name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor Health Check
        run: npx expo-doctor

      - name: TypeScript Verification (Frontend & Backend)
        run: npm run lint

      - name: Run Frontend Core Tests
        run: npm run test:frontend

      - name: Run Backend Tests
        run: npm run test:backend

      - name: Compile Backend TypeScript
        run: npm run build:backend

      - name: Export Expo Web & Native Bundle
        run: npx expo export --no-bytecode
